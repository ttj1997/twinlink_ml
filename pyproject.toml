[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "twinlink-ml"
version = "0.1.0"
description = "ML for fluidized-bed spray granulation -- TwinLink, sub-project TUHH-B"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# The grey-box model runs without PyTorch. Torch is only needed for the sequence models
# (step 4-6) and for differentiable rollouts.
torch = ["torch>=2.4"]
# Only for ExtraTreesModel (Kraeuter reproduction, see models/extra_trees.py) --
# none of the core-pipeline or architecture models needs sklearn.
sklearn = ["scikit-learn>=1.4"]
# Only for twinlink_ml.plant_data (reading the .xlsx plant exports of the
# application partner) -- no other module in the package reads Excel files.
# Partner files: openpyxl also reads the partner workbooks (partner_v4, partner_v4_1); h5py only
# for the Dyssol flowsheet file (partner_v4_1.comparison.load_dyssol_steady_state; tests skip without it).
plant-data = ["openpyxl>=3.1", "h5py>=3.10"]
train = [
    "torch>=2.4",
    "lightning>=2.4",
    "hydra-core>=1.3",
    "mlflow>=2.16",
]
# Only for twinlink_ml.rl (bandit/RL environments) -- no other module in the package
# imports gymnasium or stable-baselines3.
rl = [
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    "torch>=2.4",
]
# Only for twinlink_ml.headroom (dynamic headroom study, docs/24): symbolic model and IPOPT for
# the optimising controllers R1-R3. No other module imports casadi; its tests skip without it.
optimal-control = [
    "casadi>=3.8,<3.9",
]
# Only for twinlink_ml.surrogate_opt (surrogate-based steady RTO, docs/25): Gaussian process (M2)
# and MLP ensemble (M3). No other module of the study imports sklearn; its tests skip without it.
surrogate = [
    "scikit-learn>=1.4",
]
# Only for twinlink_ml.sensitivity (Sobol study, docs/26): Saltelli design and Sobol estimators.
# No other module imports SALib; its tests skip without it.
sensitivity = [
    "SALib>=1.5,<1.7",
]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    # Ruff and mypy are **capped from above**. An open `>=0.6` fetches a version with new
    # default rules on every fresh setup; in this project that once piled up more than
    # 200 messages that nobody had caused. Raising the cap is a deliberate act with a
    # run behind it, not a side effect of `pip install`.
    "ruff>=0.6,<0.13",
    "mypy>=1.11,<1.19",
    "nbstripout>=0.7",
    "matplotlib>=3.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/twinlink_ml"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle, pyflakes
    "I",                 # isort
    "N",                 # pep8-naming
    "UP",                # pyupgrade
    "B",                 # bugbear
    "A",                 # builtins shadowing
    "C4",                # comprehensions
    "SIM",               # simplify
    "ARG",               # unused arguments
    "PTH",               # pathlib
    "RUF",
    "D",                 # pydocstyle
    "ANN",               # missing annotations
    "NPY",
]
ignore = [
    "D203", "D213",      # conflict with D211/D212
    "ANN401",            # Any in the backend protocol is intended
    # --- Deliberately switched off, with reasons. -----------------------------
    # The rule selection above was formulated as an aspiration in step 1 and never
    # enforced; the first real run raised 223 messages, which came mostly from
    # three rule groups. Two of them are wrong for this project, one is noise.
    # Ignoring them here is a decision and not convenience -- without it the
    # remaining real hits are no longer read.
    "RUF001", "RUF002", "RUF003",
    #   "ambiguous unicode character": fires on σ, Δ, ×, ϱ, τ. In a
    #   German-language process-engineering project, Greek formula symbols
    #   in table headers and docstrings are the *correct* notation. The rule
    #   is meant against homoglyph smuggling in identifiers, not against
    #   technical notation in strings.
    "D105",
    #   "missing docstring in magic method": hits exclusively
    #   `__post_init__` of configuration dataclasses. Their content is
    #   validation; a docstring "Validates the fields." is a mere filler line.
    "D102",
    #   "missing docstring in public method": hits the `...` bodies of the
    #   protocols and ABCs (backend.py, base.py, windows.py). The meaning is
    #   in the class docstring; repeating it per stub is ballast.
    #   Concrete implementations keep D101/D103 and are still checked.
    "D401",
    #   "first line should be in imperative mood": pydocstyle checks this with an
    #   English stemming heuristic (ending "-s" and similar), which is unreliable on
    #   German docstrings -- it fires on some already-imperative forms
    #   ("Filtere ...") just as on descriptive ones. Without a reliable signal the
    #   rule is noise for this project, not quality assurance.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103", "ANN001", "ANN201", "ANN202", "SLF001", "ARG001"]
#   Tests: fixtures have no meaningful return annotation, and access to a
#   private field is acceptable in a test that checks exactly its invariant.
#   ARG001, because pytest fixtures are often requested only to enforce an
#   order.
"scripts/*" = ["D103", "T201", "D205", "D209", "E501"]
#   Driver scripts print on purpose and need no docstrings on
#   `parse_args`/`main` -- the module docstring carries the rationale.
#   Driver scripts: detailed module docstrings with formulas and tables are the
#   actual text form here, not code documentation -- D205/D209/E501 are therefore not
#   enforced. src/ and tests/ stay strict so that newly introduced messages remain
#   visible there.
"notebooks/*" = ["B905", "D100", "E402", "F401"]
#   Notebook cells are not a module; `zip(axes, TARGETS)` over two lists of
#   equal length needs no `strict=`.
"src/twinlink_ml/simulation/energy.py" = ["PLR0913"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_explicit = false          # `Array = Any` is set deliberately, see backend.py
plugins = []
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["yaml.*", "torch.*", "mlflow.*", "matplotlib.*", "scipy.*", "sklearn.*", "openpyxl.*", "SALib.*"]
ignore_missing_imports = true
#   All are optional dependencies and are imported only inside the function
#   call. Without this entry `mypy src` fails on a machine on which MLflow is
#   not installed -- that is, on every machine that has installed only the
#   core extra.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "error",
    # The tests deliberately run against the placeholder config. In a
    # production run the warning stays visible and ends up in the experiment tracking.
    "ignore::twinlink_ml.simulation.config.PlaceholderConfigWarning",
    # A dirty working tree is the rule during normal development/iteration, not a
    # test failure (G4a, docs/04_stand_ap1.md Befund 33). In a production run the
    # warning stays visible; tests that want to check it specifically catch it
    # themselves with pytest.warns(DirtyWorkingTreeWarning) (see tests/test_tracking.py).
    "ignore::twinlink_ml.utils.tracking.DirtyWorkingTreeWarning",
]
