# Variant: lab-level moisture (see greybox_lab_moisture.yaml) with GAB sorption isotherm
#
# The sorption isotherm is a GAB placeholder, NOT calibrated -- parameters were only chosen
# so that X_eq(phi=0.5, T=62°C)=0.030 kg/kg is hit (anchor from greybox_lab_moisture.yaml).
# A real calibration needs the answer of TUHH-A to the open question on the
# sorption isotherm of the actual material system. See Befund 34.
#
# critical_moisture_kg_per_kg stays at 0.200 (lab level, as in the copied
# base file) -- do NOT lower to 0.020: the safety-grid maximum of this
# GAB parametrisation lies at 0.08891 kg/kg, with 0.200 as the limit the margin stays
# a factor of 2.25; with 0.020 loading would fail with a ValueError
# (sign reversal in the drying curve, see sorption.validate_isotherm_against_
# critical_moisture) -- this is intended, not a bug.
#
# Otherwise byte-identical to greybox_lab_moisture.yaml (see there for the
# full background on the lab level); only sorption_isotherm_kind and the
# six gab_* fields are added.
#
# Variant: moisture level according to the lab measurements of the predecessor project (status LAB)
#
# Purpose: check which statements from steps 3-6 depend on the moisture
# placeholder having been too dry by a factor of 10 (see 02_prozess_setup.md).
# Only the three moisture values are changed; everything else is byte-identical
# to greybox_placeholder.yaml, so that the comparison varies exactly one factor.
#
# Cellets(R) 200 are strongly sorptive MCC pellets. Granules of an application partner can be drier
# -- this file is the upper limit of the plausible range, not the truth.
# Conversion: lab 3.2 ... 22.5 % wet mass  ->  0.033 ... 0.29 kg/kg dry.
# Grey-box process model: fluidized-bed spray granulation
#
# STATUS: placeholder -- NO value in this file is measured or confirmed by TUHH-A.
#
# All values are chosen so that they are plausible for a lab fluidized bed (~150 mm diameter,
# 2 kg bed mass) and the time constants lie in the right order of magnitude. They are
# sufficient for the ARCHITECTURE COMPARISON in AP 1 and useless for ANY
# absolute statement about energy consumption.
#
# Procedure when replacing:
#   1. Enter the value
#   2. Add the source to `provenance.description`
#   3. Set `provenance.status` to `calibrated` only once `open_todos` is empty
#   4. Redetermine the time constants with `scripts/report_time_constants.py` and
#      update the sequence lengths in the data module accordingly

provenance:
  status: placeholder
  description: >-
    Plausibilitätswerte für eine Laborwirbelschicht, gesetzt am 12.08.2026 ohne
    Rückmeldung von TUHH-A. Zeitkonstanten liegen bei tau_X ~ 15 s, tau_T ~ 80 s,
    tau_d ~ 4 h. Absolutwerte der Leistung nicht belastbar.
  open_todos:
    - "TUHH-A: Zeitschrittweite und typischer Simulationshorizont in Dyssol"
    - "TUHH-A: realistische Stellgrößenbereiche inkl. Fluidisierungsgrenzen"
    - "TUHH-A: Rechenzeit pro Simulationslauf (begrenzt Datensatzgröße)"
    - "SPE: Stoffsystem, Partikeldichte, Sorptionsisotherme, kritische Feuchte"
    - "SPE: Geometrie und Bettmasse der Laboranlage, Duesentyp"
    - "SPE/Anwendungspartner: Betriebsart kontinuierlich vs. Batch, Austragsintervalle"
    - "Anwendungspartner: Abtastrate und Rauschniveau der Anlagensensoren"
    - "Definition dE: Momentanleistung oder spezifischer Verbrauch, Referenzpunkt"
    - "Anwendungspartner: Rohrleitungs-/Filterverlust zwischen Bett und Waermeuebertrager (exhaust.outlet_duct_heat_loss_k, aktuell 0.0 = keine Kalibrierung, kein Wert erfragt)"

geometry:
  cross_section_area_m2: 0.0177        # TODO 150 mm diameter assumed
  bed_mass_solid_setpoint_kg: 2.0      # TODO
  heat_loss_ua_w_per_k: 2.0            # TODO insulated lab plant assumed

gas:
  pressure_pa: 101325.0
  r_specific_dry_air_j_per_kg_k: 287.06
  cp_dry_air_j_per_kg_k: 1006.0
  cp_vapour_j_per_kg_k: 1860.0
  viscosity_ref_pa_s: 1.716e-5
  viscosity_ref_temperature_k: 273.15
  sutherland_constant_k: 110.4

material:
  particle_density_kg_per_m3: 1500.0   # TODO material system open
  sphericity: 0.9                      # TODO
  cp_solid_j_per_kg_k: 1200.0          # TODO
  cp_water_liquid_j_per_kg_k: 4180.0
  cp_suspension_j_per_kg_k: 3500.0     # TODO depends on w_solid
  suspension_density_kg_per_m3: 1100.0 # TODO
  critical_moisture_kg_per_kg: 0.200   # LAB level -- do NOT lower to 0.020, see file header
  equilibrium_moisture_kg_per_kg: 0.030 # LAB level, was 0.003
  max_saturation_degree: 0.60          # TODO exhaust air saturation degree, literature 0.4-0.8
  # Upper limit of the driving force: marks the validity limit of the normalised
  # drying curve above ~80 C bed temperature (Y_sat diverges towards 100 C).
  max_driving_humidity_kg_per_kg: 0.50 # TODO check against drying experiments
  nucleus_diameter_m: 150.0e-6         # TODO
  # b_nuc = (d_nuc / d_50,soll)^3, here for d_50,soll = 750 um
  nucleation_solid_fraction: 0.008
  initial_diameter_m: 400.0e-6         # TODO initial bed
  # GAB sorption isotherm, structural placeholder -- see file header and Befund 34.
  sorption_isotherm_kind: gab
  gab_monolayer_moisture_kg_per_kg: 0.020
  gab_c_constant_at_reference_temperature: 25.0
  gab_k_constant_at_reference_temperature: 0.75
  gab_c_enthalpy_j_per_mol: 6000.0
  gab_k_enthalpy_j_per_mol: 500.0
  gab_reference_temperature_celsius: 62.0

energy:
  heater_efficiency: 0.98              # electric; at application partner possibly gas -> adjust
  fan_efficiency: 0.55                 # TODO
  distributor_loss_coefficient: 350.0  # TODO distributor plate + filter, zeta
  pump_pressure_rise_pa: 300000.0      # TODO
  pump_efficiency: 0.40                # TODO
  atomiser_air_kg_per_s_per_bar: 1.5e-4 # TODO two-fluid nozzle, ask for characteristic curve
  compressor_efficiency: 0.50          # TODO
  target: power_kw                     # OPEN: power_kw | specific_kwh_per_kg
  reference_value: null                # set -> dE as difference to the reference point

operation:
  mode: continuous                     # TODO continuous | batch
  mass_control_time_constant_s: 600.0  # TODO level control / discharge interval
  seed_mass_flow_kg_per_h: 0.0
  suspension_temperature_celsius: 20.0 # TODO
  initial_moisture_kg_per_kg: 0.050    # LAB level, was 0.005
  initial_bed_temperature_celsius: 55.0

actions:
  # All limits TODO -- completely open in 02_prozess_setup.md.
  inlet_temperature_celsius:
    minimum: 60.0
    maximum: 120.0
    nominal: 90.0
    max_rate_per_s: 0.5
  gas_velocity_m_per_s:
    # lower limit must lie above u_mf(d_50,max): u_mf(750 um) ~ 0.24 m/s
    minimum: 0.8
    maximum: 2.5
    nominal: 1.6
    max_rate_per_s: 0.05
  spray_rate_kg_per_h:
    minimum: 0.4
    maximum: 3.0
    nominal: 1.5
    max_rate_per_s: 0.02
  nozzle_pressure_bar:
    minimum: 1.0
    maximum: 4.0
    nominal: 2.5
    max_rate_per_s: 0.05

disturbances:
  ambient_temperature_celsius:
    minimum: 5.0
    maximum: 35.0
    nominal: 20.0
  ambient_relative_humidity:
    minimum: 0.25
    maximum: 0.85
    nominal: 0.50
  suspension_solid_fraction:
    minimum: 0.20
    maximum: 0.40
    nominal: 0.30

numerics:
  sample_time_s: 5.0                   # TODO align with Dyssol / application partner
  substeps: 5
  integrator: rk4
  state_floor: 1.0e-9
  enforce_action_bounds: true

measurement:
  enabled: true
  relative_noise_std: 0.005            # TODO estimate from plant time series
  absolute_noise_std_temperature_k: 0.2 # TODO
  sensor_time_constant_s: 10.0         # TODO thermocouple + measuring point dynamics

backend: numpy
